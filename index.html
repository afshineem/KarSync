<!doctype html>
<html lang="ku" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0284c7" />
    <meta name="description" content="KarSync - Workshop Attendance, Task Logging & Financial Settlement (Local Offline PWA)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>KarSync | سیستم مدیریت و تسویه حساب کارگاه</title>
    
    <link rel="icon" type="image/png" href="/karsync-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Google Fonts: Vazirmatn & Inter for Kurdish, Persian & English -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen antialiased selection:bg-sky-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Register service worker for offline local-first PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(
            (reg) => console.log('PWA ServiceWorker registered with scope:', reg.scope),
            (err) => console.warn('PWA ServiceWorker registration failed:', err)
          );
        });
      }
    </script>
  </body>
</html>
